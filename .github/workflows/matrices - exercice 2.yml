name: "matrices - exercice 2"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 10
          - 12
        include: # toujours exécuté après exclude, donc macos-latest / 8 sera dans la liste
          - os: macos-latest
            node: 8
        exclude:
          - os: macos-latest
            node: 10
          - os: macos-latest
            node: 8

    steps:
       - run: echo "Je m'exécute sur ${{ matrix.os }} avec la version Node  ${{ matrix.node }}"
